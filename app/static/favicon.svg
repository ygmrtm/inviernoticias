<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle with border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2.5" />

  <!-- Center emblem group -->
  <g transform="translate(32, 32)">
    <!-- 6-branch snowflake -->
    <!-- Branch 1 (0 deg - Top) -->
    <g id="branch">
      <line x1="0" y1="0" x2="0" y2="-22" stroke="url(#iceGrad)" stroke-width="3" stroke-linecap="round" />
      <line x1="0" y1="-14" x2="-6" y2="-19" stroke="url(#iceGrad)" stroke-width="2.5" stroke-linecap="round" />
      <line x1="0" y1="-14" x2="6" y2="-19" stroke="url(#iceGrad)" stroke-width="2.5" stroke-linecap="round" />
      <line x1="0" y1="-7" x2="-5" y2="-11" stroke="url(#iceGrad)" stroke-width="2" stroke-linecap="round" />
      <line x1="0" y1="-7" x2="5" y2="-11" stroke="url(#iceGrad)" stroke-width="2" stroke-linecap="round" />
      <circle cx="0" cy="-22" r="1.8" fill="#ffffff" />
    </g>

    <!-- Branch 2 (60 deg) -->
    <use href="#branch" transform="rotate(60)" />
    <!-- Branch 3 (120 deg) -->
    <use href="#branch" transform="rotate(120)" />
    <!-- Branch 4 (180 deg) -->
    <use href="#branch" transform="rotate(180)" />
    <!-- Branch 5 (240 deg) -->
    <use href="#branch" transform="rotate(240)" />
    <!-- Branch 6 (300 deg) -->
    <use href="#branch" transform="rotate(300)" />

    <!-- Central gold star crystal representing Mexican fact-checking veracity -->
    <circle cx="0" cy="0" r="6" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="0" cy="0" r="3" fill="url(#goldGrad)" />
  </g>
</svg>
